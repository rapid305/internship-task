[databases]
users_db = host=users-db port=5432 dbname=users_db user=postgres password=postgres
transaction_db = host=transaction-db port=5432 dbname=transaction_db user=postgres password=postgres

[pgbouncer]
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 3
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = trust
logfile = /dev/stdout

