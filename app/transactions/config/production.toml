dynaconf_merge = true

[production]
LOG_LEVEL = "WARNING"
DB__URL = "postgresql+asyncpg://postgres:postgres@pgbouncer:6432/transaction_db"
DB__POOL_SIZE = 0
DB__MAX_OVERFLOW = 10
DB__POOL_RECYCLE = 1800
DB__ECHO = false
SERVER__RELOAD = false

# PgBouncer settings
PGBOUNCER__POOL_MODE = "transaction"
PGBOUNCER__MAX_CLIENT_CONN = 1000
PGBOUNCER__DEFAULT_POOL_SIZE = 25
PGBOUNCER__MIN_POOL_SIZE = 10
PGBOUNCER__RESERVE_POOL_SIZE = 5
PGBOUNCER__SERVER_LIFETIME = 3600
PGBOUNCER__SERVER_IDLE_TIMEOUT = 600
PGBOUNCER__SERVER_CONNECT_TIMEOUT = 15

