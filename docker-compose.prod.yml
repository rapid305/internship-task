services:
  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 384M

  redis:
    image: redis:8.4.0-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
      - "${KAFKA_CONTROLLER_PORT}:${KAFKA_CONTROLLER_PORT}"
    environment:
      KAFKA_KRAFT_MODE: "${KAFKA_KRAFT_MODE}"
      KAFKA_PROCESS_ROLES: "${KAFKA_PROCESS_ROLES}"
      KAFKA_NODE_ID: "${KAFKA_NODE_ID}"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
      KAFKA_LISTENERS: "${KAFKA_LISTENERS}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "${KAFKA_INTER_BROKER_LISTENER_NAME}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "${KAFKA_CONTROLLER_LISTENER_NAMES}"
      KAFKA_ADVERTISED_LISTENERS: "${KAFKA_ADVERTISED_LISTENERS}"
      KAFKA_LOG_DIRS: "${KAFKA_LOG_DIRS}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}"
      KAFKA_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS}"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_PORT}
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 384M

  users-db:
    image: postgres:18.1-alpine
    container_name: users_database
    environment:
      POSTGRES_DB: "${POSTGRES_USERS_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_USERS_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USERS_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M

  transaction-db:
    image: postgres:18.1-alpine
    container_name: transaction_database
    environment:
      POSTGRES_DB: "${POSTGRES_TRANSACTIONS_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_TRANSACTIONS_PORT}:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TRANSACTIONS_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASES_HOST: "users-db,transaction-db"
      DATABASES_PORT: "5432,5432"
      DATABASES_DBNAME: "${POSTGRES_USERS_DB},${POSTGRES_TRANSACTIONS_DB}"
      DATABASES_USER: "${POSTGRES_USER},${POSTGRES_USER}"
      DATABASES_PASSWORD: "${POSTGRES_PASSWORD},${POSTGRES_PASSWORD}"
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/logs:/var/log/pgbouncer
    depends_on:
      users-db:
        condition: service_healthy
      transaction-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: users
    container_name: userservice_app
    environment:
      - USER_SERVICE_ENV=${ENVIRONMENT}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_AMQP_PORT}/
      - REDIS_URL=redis://redis:${REDIS_PORT}/0
    ports:
      - "${USER_SERVICE_PORT}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "uvicorn app.users.main:app --host 0.0.0.0 --port 8000"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: transactions
    container_name: transactionservice_app
    environment:
      - TRANSACTION_SERVICE_ENV=${ENVIRONMENT}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_AMQP_PORT}/
      - REDIS_URL=redis://redis:${REDIS_PORT}/0
    ports:
      - "${TRANSACTION_SERVICE_PORT}:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "uvicorn app.transactions.main:app --host 0.0.0.0 --port 8001"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker
    environment:
      - TRANSACTION_SERVICE_ENV=${ENVIRONMENT}
      - WORKERS=${WORKERS}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_AMQP_PORT}/
      - REDIS_URL=redis://redis:${REDIS_PORT}/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "python -m taskiq worker app.transactions.taskiq_broker:broker 
             --workers ${WORKERS}
             --fs-discover
             --tasks-pattern 'tasks/*.py'
             --log-level info"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M

  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      user-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "
      apk add --no-cache openssl;
      if [ ! -f /etc/nginx/ssl/cert.pem ] || [ ! -f /etc/nginx/ssl/key.pem ]; then
        echo 'Generating self-signed SSL certificates...';
        openssl req -x509 -newkey rsa:4096 -nodes -out /etc/nginx/ssl/cert.pem -keyout /etc/nginx/ssl/key.pem -days 365 -subj '/C=RU/ST=Moscow/L=Moscow/O=Org/CN=localhost';
        echo 'SSL certificates generated successfully';
      fi;
      nginx -g 'daemon off;'
      "
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  users_postgres_data:
  transaction_postgres_data:
  rabbitmq_data:
  redis_data:
  kafka_data:

networks:
    backend:
        driver: bridge