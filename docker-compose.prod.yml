services:
  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 150M

  redis:
    image: redis:8.4.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data_prod:/var/lib/zookeeper/data
      - zookeeper_logs_prod:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 200M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 104857600
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data_prod:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 600M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 350M

  users-db:
    image: postgres:18.1-alpine
    container_name: users_database
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users_postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user_db" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 200M

  transaction-db:
    image: postgres:18.1-alpine
    container_name: transaction_database
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - transaction_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d transaction_db" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 200M

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: users
    container_name: userservice_app
    environment:
      - USER_SERVICE_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "uvicorn app.users.main:app --host 0.0.0.0 --port 8000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 150M

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: transactions
    container_name: transactionservice_app
    environment:
      - TRANSACTION_SERVICE_ENV=production
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      transaction-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "uvicorn app.transactions.main:app --host 0.0.0.0 --port 8001"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 150M

  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskiq_worker
    environment:
      - TRANSACTION_SERVICE_ENV=production
      - WORKERS=2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      transaction-db:
        condition: service_healthy
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "python -m taskiq worker app.transactions.taskiq_broker:broker 
             --workers ${WORKERS:-2}
             --fs-discover
             --tasks-pattern 'tasks/*.py'
             --log-level info"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 300M

  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      user-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    command: >
      sh -c "
      apk add --no-cache openssl;
      if [ ! -f /etc/nginx/ssl/cert.pem ] || [ ! -f /etc/nginx/ssl/key.pem ]; then
        echo 'Generating self-signed SSL certificates...';
        openssl req -x509 -newkey rsa:4096 -nodes -out /etc/nginx/ssl/cert.pem -keyout /etc/nginx/ssl/key.pem -days 365 -subj '/C=RU/ST=Moscow/L=Moscow/O=Org/CN=localhost';
        echo 'SSL certificates generated successfully';
      fi;
      nginx -g 'daemon off;'
      "
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  users_postgres_data_prod:
  transaction_postgres_data_prod:
  rabbitmq_data_prod:
  redis_data_prod:
  zookeeper_data_prod:
  zookeeper_logs_prod:
  kafka_data_prod:
